name: AppImage Ubuntu 22.04 Smoke Test

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      report-name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  launch:
    name: 在独立 Ubuntu 22.04 X11 环境验证 AppImage
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    timeout-minutes: 10
    steps:
      - name: 安装系统运行库和截图工具
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3 libegl1 libgl1 libdbus-1-3 xvfb xdotool x11-utils imagemagick locales fonts-noto-cjk
          locale-gen en_US.UTF-8 zh_CN.UTF-8 de_DE.UTF-8
          # These must come from the AppImage, not an accidentally enriched test host.
          if ldconfig -p | grep -E 'libxkbcommon-x11\.so|libxcb-(cursor|icccm|keysyms)\.so'; then
            echo 'The smoke-test host must not preinstall Qt X11 helper libraries' >&2
            exit 1
          fi

      - name: 检出验证脚本
        uses: actions/checkout@v4

      - name: 下载最终 AppImage
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: appimage-input

      - name: 验证主窗口并保存多语言截图
        timeout-minutes: 6
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          chmod +x "appimage-input/$ARTIFACT_NAME"
          python3 .github/scripts/smoke_appimage.py "appimage-input/$ARTIFACT_NAME" --output-dir appimage-smoke

      - name: 上传启动截图、日志和 SHA-256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report-name }}
          path: appimage-smoke/
          if-no-files-found: ignore
